name: nebula-rag-local-it
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg15
    container_name: nebula-rag-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${RAG_LOCAL_DB_PASSWORD:?generated by Start-RagLocal.ps1}
      RAG_LOCAL_AUTHENTICATOR_PASSWORD: ${RAG_LOCAL_AUTHENTICATOR_PASSWORD:?generated by Start-RagLocal.ps1}
      RAG_LOCAL_API_PASSWORD: ${RAG_LOCAL_API_PASSWORD:?generated by Start-RagLocal.ps1}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - nebula_rag_local_pgdata:/var/lib/postgresql/data
      - ./init/00-prerequisites.sh:/docker-entrypoint-initdb.d/00-prerequisites.sh:ro
      - ../../supabase/migrations/20261124060000_rag_academic_documents.sql:/docker-entrypoint-initdb.d/10-rag-01.sql:ro
      - ../../supabase/migrations/20261124070000_rag_document_lifecycle.sql:/docker-entrypoint-initdb.d/20-rag-lifecycle.sql:ro
      - ../../supabase/migrations/20261124080000_rag_classification_hybrid_search.sql:/docker-entrypoint-initdb.d/30-rag-classification.sql:ro
      - ../../supabase/migrations/20261124090000_rag_api_role.sql:/migrations/20261124090000_rag_api_role.sql:ro
      - ../../supabase/migrations/20261124100000_rag_ingestion_roles.sql:/docker-entrypoint-initdb.d/50-rag-ingestion.sql:ro
      - ../../supabase/migrations/20261124110000_rag_demo_content_guard.sql:/docker-entrypoint-initdb.d/60-rag-demo-guard.sql:ro
      - ./init/40-rag-api-role.sql:/docker-entrypoint-initdb.d/40-rag-api-role.sql:ro
      - ./init/50-rag-api-login.sh:/docker-entrypoint-initdb.d/50-rag-api-login.sh:ro
      - ./init/90-synthetic-fixtures.sql:/docker-entrypoint-initdb.d/90-synthetic-fixtures.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_local"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [rag_local]
  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: nebula-rag-local-postgrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${RAG_LOCAL_AUTHENTICATOR_PASSWORD}@postgres:5432/rag_local
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${RAG_LOCAL_JWT_SECRET}
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_SERVER_PORT: 3000
    ports:
      - "127.0.0.1:53000:3000"
    networks: [rag_local]
networks:
  rag_local:
    name: nebula-rag-local-network
volumes:
  nebula_rag_local_pgdata:
    name: nebula-rag-local-pgdata
