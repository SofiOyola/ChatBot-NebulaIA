[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nebula-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "gunicorn==23.0.0",
  "psycopg[binary]==3.2.6",
  "pypdf==7.1.1",
  "requests==2.34.2",
]

[tool.setuptools.packages.find]
where = ["src"]
